name: Verify Almalaki Pull Request

on:
  # Also run on feature-branch pushes so this workflow can verify its own
  # first introduction before it is merged into main.
  push:
    branches-ignore:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/verify-almalaki-pr.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/verify-almalaki-pr.yml'

permissions:
  contents: read

jobs:
  debug-build:
    name: Compile Almalaki Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Assemble Debug
        run: gradle :app:assembleDebug --no-daemon
