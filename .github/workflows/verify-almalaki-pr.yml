name: Verify Almalaki Pull Request

on:
  # Also run on feature-branch pushes so this workflow can verify its own
  # first introduction before it is merged into main.
  push:
    branches-ignore:
      - main
    paths:
      - 'app/**'
      - 'royaltv/**'
      - 'database/**'
      - 'supabase/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/verify-almalaki-pr.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'royaltv/**'
      - 'database/**'
      - 'supabase/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/verify-almalaki-pr.yml'

permissions:
  contents: read

jobs:
  tenant-scope-sql:
    name: Test strict owner restaurant scope migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: almalaki_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d almalaki_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Run tenant-scope migration tests
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: almalaki_test
        run: |
          psql -v ON_ERROR_STOP=1 -f database/tests/strict_owner_restaurant_scope.sql
          createdb almalaki_royal_tv_test
          PGDATABASE=almalaki_royal_tv_test psql -v ON_ERROR_STOP=1 -f database/tests/royal_tv_device_realtime_isolation.sql

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check ROYAL TV device auth Edge Function
        run: deno check supabase/functions/royal-tv-device-auth/index.ts

  debug-build:
    name: Compile Almalaki and ROYAL TV Debug APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Assemble Debug
        run: gradle :app:assembleDebug :royaltv:assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Almalaki-PR-Debug-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            royaltv/build/outputs/apk/debug/royaltv-debug.apk
          if-no-files-found: error
