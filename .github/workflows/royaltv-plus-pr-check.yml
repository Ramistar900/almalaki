name: ROYAL TV Plus PR Build

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'royaltv/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/royaltv-plus-pr-check.yml'

permissions:
  contents: read

concurrency:
  group: royal-tv-plus-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile app and ROYAL TV debug variants
        run: gradle :app:assembleDebug :royaltv:assembleDebug --no-daemon
