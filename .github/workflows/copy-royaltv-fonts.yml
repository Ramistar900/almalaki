name: Copy fonts to ROYAL TV

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-fonts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy font resources
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p royaltv/src/main/res/font

          cp -f app/src/main/res/font/*.ttf \
            royaltv/src/main/res/font/

          echo "Original font files:"
          find app/src/main/res/font \
            -maxdepth 1 -type f -name '*.ttf' | wc -l

          echo "ROYAL TV font files:"
          find royaltv/src/main/res/font \
            -maxdepth 1 -type f -name '*.ttf' | wc -l

          test "$(find app/src/main/res/font \
            -maxdepth 1 -type f -name '*.ttf' | wc -l)" \
            -eq "$(find royaltv/src/main/res/font \
            -maxdepth 1 -type f -name '*.ttf' | wc -l)"

      - name: Commit copied fonts
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add royaltv/src/main/res/font/*.ttf

          if git diff --cached --quiet; then
            echo "No font changes to commit."
            exit 0
          fi

          git commit -m \
            "Copy font resources into standalone ROYAL TV app"

          git push
