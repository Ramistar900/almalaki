name: Build Almalaki APK

permissions:
  contents: write

concurrency:
  group: almalaki-versioned-build
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/build-apk.yml'

jobs:
  build-almalaki:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Decode Almalaki Release Keystore
        env:
          ALMALAKI_KEYSTORE_BASE64: ${{ secrets.ALMALAKI_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ALMALAKI_KEYSTORE_BASE64"
          printf '%s' "$ALMALAKI_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/almalaki-release.jks"
          test -s "$RUNNER_TEMP/almalaki-release.jks"
          echo "ALMALAKI_RELEASE_STORE_FILE=$RUNNER_TEMP/almalaki-release.jks" >> "$GITHUB_ENV"
      - name: Verify Almalaki Release Keystore
        env:
          ALMALAKI_STORE_PASSWORD: ${{ secrets.ALMALAKI_STORE_PASSWORD }}
          ALMALAKI_KEY_ALIAS: ${{ secrets.ALMALAKI_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$ALMALAKI_STORE_PASSWORD" ]; then
            echo "::error::ALMALAKI_STORE_PASSWORD is empty"
            exit 1
          fi
          if [ -z "$ALMALAKI_KEY_ALIAS" ]; then
            echo "::error::ALMALAKI_KEY_ALIAS is empty"
            exit 1
          fi
          keytool -list \
            -keystore "$RUNNER_TEMP/almalaki-release.jks" \
            -storepass "$ALMALAKI_STORE_PASSWORD" \
            -alias "$ALMALAKI_KEY_ALIAS"


      - name: Prepare next Almalaki version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import pathlib
          import re

          path = pathlib.Path("app/build.gradle.kts")
          content = path.read_text(encoding="utf-8")

          code_match = re.search(r'(?m)^(\s*versionCode\s*=\s*)(\d+)\s*        env:
          ALMALAKI_STORE_PASSWORD: ${{ secrets.ALMALAKI_STORE_PASSWORD }}
          ALMALAKI_KEY_ALIAS: ${{ secrets.ALMALAKI_KEY_ALIAS }}
          ALMALAKI_KEY_PASSWORD: ${{ secrets.ALMALAKI_KEY_PASSWORD }}
        run: |
          gradle :app:assembleDebug :app:assembleRelease --no-daemon
          
      - name: Verify Almalaki Release APK Signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          

      - name: Upload Almalaki Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Almalaki-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Almalaki Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Almalaki-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          
