          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"new_version={new_name}\n")
              output.write(f"new_code={new_code}\n")
          print(f"Almalaki version: {old_name} -> {new_name}")
          print(f"Almalaki versionCode: {old_code} -> {new_code}")
          PY

      - name: Build Almalaki Debug and Release
        env:
          ALMALAKI_STORE_PASSWORD: ${{ secrets.ALMALAKI_STORE_PASSWORD }}
          ALMALAKI_KEY_ALIAS: ${{ secrets.ALMALAKI_KEY_ALIAS }}
          ALMALAKI_KEY_PASSWORD: ${{ secrets.ALMALAKI_KEY_PASSWORD }}
        run: |
          gradle :app:assembleDebug :app:assembleRelease --no-daemon
          
      - name: Verify Almalaki Release APK Signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          

      - name: Upload Almalaki Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Almalaki-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Almalaki Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Almalaki-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Save version after successful build
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          NEW_CODE: ${{ steps.version.outputs.new_code }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          if git diff --cached --quiet; then
            echo "No version change to save."
            exit 1
          fi
          git commit -m "chore(almalaki): bump version to $NEW_VERSION ($NEW_CODE) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

