name: Build Almalaki and ROYAL TV APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Both Apps
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK Files
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Almalaki.apk
          cp royaltv/build/outputs/apk/debug/royaltv-debug.apk release/ROYAL-TV.apk
          ls -lh release/

      - name: Upload Both APKs
        uses: actions/upload-artifact@v4
        with:
          name: Almalaki-and-ROYAL-TV
          path: release/*.apk
          if-no-files-found: error
