
name: Build ROYAL TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'royaltv/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/build-royaltv.yml'

jobs:
  build-royaltv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build ROYAL TV Only
        run: gradle :royaltv:assembleDebug --no-daemon

      - name: Audit ROYAL TV APK
        shell: bash
        run: |
          set -euo pipefail

          APK="royaltv/build/outputs/apk/debug/royaltv-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          test -f "$APK"

          echo "===== APK SHA-256 ====="
          sha256sum "$APK"

          echo "===== PACKAGE DETAILS ====="
          "$AAPT" dump badging "$APK" | head -n 15

          echo "===== DECLARED APK PERMISSIONS ====="
          "$AAPT" dump permissions "$APK"

          echo "===== SIGNATURE VERIFICATION ====="
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload ROYAL TV APK
        uses: actions/upload-artifact@v4
        with:
          name: ROYAL-TV-APK
          path: royaltv/build/outputs/apk/debug/royaltv-debug.apk
          if-no-files-found: error
          
