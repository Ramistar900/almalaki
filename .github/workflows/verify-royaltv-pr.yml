name: Verify ROYAL TV Pull Request

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'royaltv/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/**'
      - '.github/workflows/verify-royaltv-pr.yml'
      - '.github/workflows/build-royaltv.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'royaltv/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/**'
      - '.github/workflows/verify-royaltv-pr.yml'

permissions:
  contents: read

jobs:
  debug-build:
    name: Compile ROYAL TV Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Assemble ROYAL TV Debug
        run: gradle :royaltv:assembleDebug --no-daemon

      - name: Upload ROYAL TV Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ROYAL-TV-PR-Debug-APK
          path: royaltv/build/outputs/apk/debug/royaltv-debug.apk
          if-no-files-found: error
