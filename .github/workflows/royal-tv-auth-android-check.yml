name: ROYAL TV Authorization Android Check

'on':
  pull_request:
    branches: [main]
    paths:
      - 'royaltv/**'
      - '.github/workflows/royal-tv-auth-android-check.yml'
  push:
    branches: [royal-tv-server-authorization-phase1]
    paths:
      - 'royaltv/**'
      - '.github/workflows/royal-tv-auth-android-check.yml'

permissions:
  contents: read

jobs:
  compile-royaltv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile ROYAL TV debug Kotlin
        run: gradle :royaltv:compileDebugKotlin --no-daemon
