name: Stage APK Builds as Draft Releases

on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows:
      - Build Almalaki APK
      - Build ROYAL TV APK
    types:
      - completed

permissions:
  actions: read
  contents: write

jobs:
  validate-publish-workflow:
    name: Validate automatic release workflow
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Parse workflow YAML
        run: ruby -e 'require "yaml"; YAML.load_file(".github/workflows/stage-apk-drafts.yml")'

      - name: Confirm publishing is restricted to successful main builds
        shell: bash
        run: |
          grep -F "github.event.workflow_run.conclusion == 'success'" .github/workflows/stage-apk-drafts.yml
          grep -F "github.event.workflow_run.head_branch == 'main'" .github/workflows/stage-apk-drafts.yml
          grep -F "secrets.GH_RELEASE_TOKEN" .github/workflows/stage-apk-drafts.yml

  stage-draft:
    name: Create or refresh the app draft
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (
        github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Select application and artifact
        id: release
        shell: bash
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          case "$WORKFLOW_NAME" in
            "Build Almalaki APK")
              echo "artifact=Almalaki-Release-APK" >> "$GITHUB_OUTPUT"
              echo "tag=almalaki-build-$RUN_ID" >> "$GITHUB_OUTPUT"
              echo "title=Almalaki staged build $RUN_ID" >> "$GITHUB_OUTPUT"
              echo "filename=almalaki-release.apk" >> "$GITHUB_OUTPUT"
              ;;
            "Build ROYAL TV APK")
              echo "artifact=ROYAL-TV-Release-APK" >> "$GITHUB_OUTPUT"
              echo "tag=royaltv-build-$RUN_ID" >> "$GITHUB_OUTPUT"
              echo "title=ROYAL TV staged build $RUN_ID" >> "$GITHUB_OUTPUT"
              echo "filename=royaltv-release.apk" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported workflow: $WORKFLOW_NAME"
              exit 1
              ;;
          esac

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Download signed APK
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ARTIFACT: ${{ steps.release.outputs.artifact }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apk-release"

          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT" \
            --dir "$RUNNER_TEMP/apk-release"

          COUNT="$(find "$RUNNER_TEMP/apk-release" \
            -type f -name '*.apk' | wc -l)"

          if [ "$COUNT" -ne 1 ]; then
            echo "Expected exactly one APK, found $COUNT"
            exit 1
          fi

      - name: Publish signed APK release automatically
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          TITLE: ${{ steps.release.outputs.title }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          FILENAME: ${{ steps.release.outputs.filename }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Configure repository secret GH_RELEASE_TOKEN with Contents: Read and write permission."
            exit 1
          fi
          APK="$(find "$RUNNER_TEMP/apk-release" -type f -name "*.apk" -print -quit)"
          test -n "$APK"
          mv "$APK" "$RUNNER_TEMP/$FILENAME"
          NOTES="Automatically published signed APK from successful build of commit $SOURCE_SHA."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/$FILENAME" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" "$RUNNER_TEMP/$FILENAME" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "$TITLE" --notes "$NOTES"
          fi
