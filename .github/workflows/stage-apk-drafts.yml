name: Stage APK Builds as Draft Releases

on:
  workflow_run:
    workflows:
      - Build Almalaki APK
      - Build ROYAL TV APK
    types:
      - completed

permissions:
  actions: read
  contents: write

jobs:
  stage-draft:
    name: Create or refresh the app draft
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Select application and artifact
        id: release
        shell: bash
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          case "$WORKFLOW_NAME" in
            "Build Almalaki APK")
              echo "artifact=Almalaki-Release-APK" >> "$GITHUB_OUTPUT"
              echo "tag=almalaki-latest-draft" >> "$GITHUB_OUTPUT"
              echo "title=Almalaki staged build $RUN_ID" >> "$GITHUB_OUTPUT"
              echo "filename=almalaki-release.apk" >> "$GITHUB_OUTPUT"
              ;;
            "Build ROYAL TV APK")
              echo "artifact=ROYAL-TV-Release-APK" >> "$GITHUB_OUTPUT"
              echo "tag=royaltv-latest-draft" >> "$GITHUB_OUTPUT"
              echo "title=ROYAL TV staged build $RUN_ID" >> "$GITHUB_OUTPUT"
              echo "filename=royaltv-release.apk" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported workflow: $WORKFLOW_NAME"
              exit 1
              ;;
          esac

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Download signed APK
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ARTIFACT: ${{ steps.release.outputs.artifact }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apk-release"

          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT" \
            --dir "$RUNNER_TEMP/apk-release"

          count="$(find "$RUNNER_TEMP/apk-release" \
            -type f -name '*.apk' | wc -l)"
          test "$count" -eq 1

      - name: Replace previous staging draft only
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then

            IS_DRAFT="$(gh release view "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft --jq '.isDraft')"

            if [ "$IS_DRAFT" != "true" ]; then
              echo "Refusing to replace a published release: $TAG"
              exit 1
            fi

            gh release delete "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --cleanup-tag \
              --yes
          fi

      - name: Create latest unpublished APK draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          TITLE: ${{ steps.release.outputs.title }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          FILENAME: ${{ steps.release.outputs.filename }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$RUNNER_TEMP/apk-release" \
            -type f -name '*.apk' -print -quit)"
          test -n "$APK"

          mv "$APK" "$RUNNER_TEMP/$FILENAME"

          gh release create "$TAG" \
            "$RUNNER_TEMP/$FILENAME" \
            --repo "$GITHUB_REPOSITORY" \
  
            --draft \
            --title "$TITLE" \
            --notes "Latest signed APK staged from source commit $SOURCE_SHA after a successful build. Manual review and publication required."
            
